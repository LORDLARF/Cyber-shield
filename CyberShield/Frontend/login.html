<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация — Кибер Щит</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">🛡️ КИБЕР ЩИТ</a>
    <nav>
      <a href="register.html">Регистрация</a>
    </nav>
  </header>

  <div class="container" style="max-width: 500px;">
    <div class="card">
      <h2>Вход в систему</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="login" placeholder="Введите логин" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="pass" placeholder="Введите пароль" required>
        </div>
        <div class="error-msg" id="authErr" style="margin-bottom: 20px; display: block;">Неверная пара логин/пароль</div>
        <button type="submit" class="btn">Войти</button>
      </form>
    </div>
  </div>

  <script>
    
    document.getElementById('authErr').style.display = 'none';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const login = document.getElementById('login').value.trim();
      const pass = document.getElementById('pass').value;

      
      if (login === 'student' && pass === '123456') {
        window.location.href = 'profile.html';
      } else {
        document.getElementById('authErr').style.display = 'block';
      }
    });
  </script>
</body>
</html>
